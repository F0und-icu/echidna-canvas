<div id="echidna-agent-canvas" aria-label="Echidna 模型响应与决策画布">
  <style>
    #echidna-agent-canvas{--ac-bg:#F6F3ED;--ac-paper:#FAF8F4;--ac-title:#2C2B27;--ac-text:#55534D;--ac-muted:#777268;--ac-primary:#825B42;--ac-green:#53684F;--ac-line:#DBD5CA;--ac-code:#ECE7DF;--ac-radius:0px;--ac-mono:"SFMono-Regular",Consolas,"Liberation Mono","PingFang SC",monospace;font:14px/1.5 var(--ac-mono);color:var(--ac-text);background:var(--ac-bg);color-scheme:light;position:relative}
    #echidna-agent-canvas *{box-sizing:border-box}
    #echidna-agent-canvas button,#echidna-agent-canvas input,#echidna-agent-canvas select,#echidna-agent-canvas textarea{font:inherit;color:inherit}
    #echidna-agent-canvas button{touch-action:manipulation}
    #echidna-agent-canvas .ac-header{height:76px;padding:0 32px;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--ac-line)}
    #echidna-agent-canvas .ac-logo{font:27px/1 "Baskerville","Times New Roman",Georgia,serif;letter-spacing:-1px;color:var(--ac-title)}
    #echidna-agent-canvas .ac-caption{font-size:11px;letter-spacing:1.4px;color:var(--ac-muted);padding-left:20px;border-left:1px solid var(--ac-line)}
    #echidna-agent-canvas .ac-demo{margin-left:auto;color:var(--ac-muted);font-size:11px;letter-spacing:.5px}
    #echidna-agent-canvas .ac-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ac-line);background:var(--ac-paper);border-radius:0;padding:7px 10px;font-size:12px;min-height:34px}
    #echidna-agent-canvas .ac-button svg{width:14px;height:14px}
    #echidna-agent-canvas .ac-primary{background:var(--ac-paper);border-color:var(--ac-primary);color:var(--ac-primary)}
    #echidna-agent-canvas .ac-quiet{background:none;border-color:transparent}
    #echidna-agent-canvas .ac-button[aria-pressed="true"]{color:var(--ac-primary);border-color:var(--ac-primary);background:var(--ac-paper)}
    #echidna-agent-canvas .ac-board{height:688px;position:relative;overflow:clip;touch-action:none;isolation:isolate}
    #echidna-agent-canvas .ac-board.has-grid{background-image:linear-gradient(color-mix(in srgb,var(--ac-line) 42%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ac-line) 42%,transparent) 1px,transparent 1px);background-size:40px 40px}
    #echidna-agent-canvas .ac-world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0}
    #echidna-agent-canvas .ac-wires{position:absolute;left:-4000px;top:-4000px;width:12000px;height:10000px;max-width:none;max-height:none;overflow:visible;pointer-events:none}
    #echidna-agent-canvas .ac-wire{fill:none;stroke:var(--ac-muted);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
    #echidna-agent-canvas .ac-wire.pending{stroke-dasharray:3 5}
    #echidna-agent-canvas .ac-wire.coop{stroke:var(--ac-green);stroke-dasharray:5 5}
    #echidna-agent-canvas .ac-wire.ended{stroke:var(--ac-line)}
    #echidna-agent-canvas .ac-wire-label{font:12px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:var(--ac-text);paint-order:stroke;stroke:var(--ac-bg);stroke-width:12px;stroke-linejoin:round;dominant-baseline:middle}
    #echidna-agent-canvas .ac-agent{position:absolute;width:216px;height:168px;border:1px solid var(--ac-line);border-radius:0;background:var(--ac-paper);z-index:2}
    #echidna-agent-canvas .ac-agent.is-selected{border-color:var(--ac-primary);border-width:1.5px}
    #echidna-agent-canvas .ac-agent.is-link-target{border-color:var(--ac-green);background:var(--ac-code)}
    #echidna-agent-canvas .ac-agent-head{height:38px;padding:0 14px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--ac-line);touch-action:none;cursor:grab}
    #echidna-agent-canvas .ac-monogram{font:10px var(--ac-mono);letter-spacing:1px;color:var(--ac-muted)}
    #echidna-agent-canvas .ac-agent-name{color:var(--ac-title);font-size:12px;font-weight:400}
    #echidna-agent-canvas .ac-agent-id{margin-left:auto;font:10px var(--ac-mono);color:var(--ac-muted)}
    #echidna-agent-canvas .ac-agent-task{height:44px;margin:16px 16px 0;font-size:13px;color:var(--ac-title);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    #echidna-agent-canvas .ac-agent-task:before{content:"> ";color:var(--ac-primary)}
    #echidna-agent-canvas .ac-agent-meta{margin:3px 16px 0;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--ac-muted)}
    #echidna-agent-canvas .ac-agent-meta .ac-dot{width:5px;height:5px;border-radius:50%;background:var(--ac-primary)}
    #echidna-agent-canvas .ac-agent-controls{height:36px;border-top:1px solid var(--ac-line);margin-top:10px;padding:0 9px;display:flex;align-items:center;gap:5px}
    #echidna-agent-canvas .ac-agent-controls button{background:none;border:0;border-radius:3px;padding:4px 5px;min-height:28px;font-size:11px;color:var(--ac-muted)}
    #echidna-agent-canvas .ac-agent-controls .ac-run{color:var(--ac-primary);margin-right:auto}
    #echidna-agent-canvas .ac-port{position:absolute;left:calc(50% - 13px);bottom:-14px;width:26px;height:26px;padding:8px;border:0;background:transparent;z-index:4}
    #echidna-agent-canvas .ac-port:after{content:"";display:block;width:9px;height:9px;border:1px solid var(--ac-green);background:var(--ac-paper);border-radius:50%}
    #echidna-agent-canvas .ac-trace{position:absolute;width:152px;height:68px;padding:10px;border:1px solid var(--ac-muted);background:var(--ac-paper);border-radius:var(--ac-radius);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:1}
    #echidna-agent-canvas .ac-trace-title{font-size:13px;font-weight:400;color:var(--ac-title);white-space:nowrap}
    #echidna-agent-canvas .ac-trace-meta{font-size:11px;color:var(--ac-muted);white-space:nowrap}
    #echidna-agent-canvas .ac-trace.active{background:var(--ac-paper);border-color:var(--ac-primary)}
    #echidna-agent-canvas .ac-trace.active .ac-trace-title:before{content:"> ";color:var(--ac-primary)}
    #echidna-agent-canvas .ac-trace.alternative{border-style:dashed;background:var(--ac-bg)}
    #echidna-agent-canvas .ac-trace.decision{width:136px;height:96px;border:0;border-radius:0;background:transparent}
    #echidna-agent-canvas .ac-trace.decision:before{content:"";position:absolute;inset:0;background:var(--ac-primary);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
    #echidna-agent-canvas .ac-trace.decision:after{content:"";position:absolute;inset:1.5px;background:var(--ac-bg);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
    #echidna-agent-canvas .ac-trace.decision span{position:relative;z-index:1;color:var(--ac-primary)}
    #echidna-agent-canvas .ac-trace.new{animation:ac-appear .32s ease-out}
    #echidna-agent-canvas .ac-frontier{position:absolute;width:28px;height:28px;display:grid;place-items:center;border:1px dashed var(--ac-muted);border-radius:50%;background:var(--ac-bg);color:var(--ac-muted);font-size:16px;z-index:1}
    #echidna-agent-canvas .ac-frontier-label{position:absolute;color:var(--ac-muted);font-size:11px;white-space:nowrap;transform:translateX(-50%)}
    #echidna-agent-canvas .ac-coop-label{position:absolute;transform:translate(-50%,-50%);padding:5px 10px;background:var(--ac-bg);border:1px solid var(--ac-line);border-radius:4px;font-size:11px;color:var(--ac-green);z-index:3;white-space:nowrap}
    #echidna-agent-canvas .ac-coop-label.ended{color:var(--ac-muted)}
    #echidna-agent-canvas .ac-board-top{position:absolute;left:24px;top:20px;z-index:4;pointer-events:none}
    #echidna-agent-canvas .ac-board-top h2{font:400 23px/1.4 "Songti SC",STSong,Georgia,serif;letter-spacing:.5px;color:var(--ac-title);margin:0}
    #echidna-agent-canvas .ac-board-top p{font-size:11px;color:var(--ac-muted);margin:6px 0 0}
    #echidna-agent-canvas .ac-tools{position:absolute;bottom:20px;left:24px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 48px);z-index:4;background:var(--ac-paper);padding:4px;border:1px solid var(--ac-line);border-radius:0}
    #echidna-agent-canvas .ac-zoom{position:absolute;bottom:20px;right:24px;display:flex;align-items:center;gap:2px;z-index:4;background:var(--ac-paper);border:1px solid var(--ac-line);padding:4px;border-radius:0}
    #echidna-agent-canvas .ac-zoom button{width:30px;min-height:32px;border:0;background:none;font-size:16px}
    #echidna-agent-canvas .ac-zoom output{min-width:38px;text-align:center;font:11px ui-monospace,monospace;color:var(--ac-muted)}
    #echidna-agent-canvas .ac-message{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);border:1px solid var(--ac-line);border-radius:5px;background:var(--ac-paper);padding:8px 14px;font-size:12px;color:var(--ac-green);z-index:4;white-space:nowrap}
    #echidna-agent-canvas .ac-foot{height:35px;padding:0 24px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ac-line);font-size:11px;color:var(--ac-muted);gap:12px}
    #echidna-agent-canvas .ac-inspector{position:absolute;right:16px;top:92px;width:324px;max-width:calc(100% - 32px);background:var(--ac-paper);border:1px solid var(--ac-muted);border-radius:0;z-index:8;padding:20px}
    #echidna-agent-canvas .ac-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
    #echidna-agent-canvas .ac-panel-head h3{font:400 20px/1.4 "Songti SC",STSong,Georgia,serif;color:var(--ac-title);margin:0}
    #echidna-agent-canvas .ac-panel-close{border:0;background:none;color:var(--ac-muted);font-size:20px;width:30px;height:30px}
    #echidna-agent-canvas .ac-field{display:block;margin:12px 0}
    #echidna-agent-canvas .ac-field>span{display:block;color:var(--ac-muted);font-size:11px;margin-bottom:5px}
    #echidna-agent-canvas input[type="text"],#echidna-agent-canvas select,#echidna-agent-canvas textarea{width:100%;padding:8px 10px;background:var(--ac-bg);border:1px solid var(--ac-line);border-radius:4px;font-size:12px;min-width:0}
    #echidna-agent-canvas textarea{resize:vertical;min-height:58px;line-height:1.5}
    #echidna-agent-canvas .ac-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
    #echidna-agent-canvas .ac-account-state{font-size:11px;color:var(--ac-muted)}
    #echidna-agent-canvas .ac-personas{display:flex;gap:6px;margin:5px 0 8px}
    #echidna-agent-canvas .ac-personas button{flex:1;padding:5px;border:1px solid var(--ac-line);border-radius:4px;background:transparent;color:var(--ac-muted);font-size:11px}
    #echidna-agent-canvas .ac-personas button[aria-pressed="true"]{border-color:var(--ac-primary);color:var(--ac-primary)}
    #echidna-agent-canvas .ac-panel-bottom{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    #echidna-agent-canvas .ac-panel-note{font-size:10px;color:var(--ac-muted);max-width:155px}
    #echidna-agent-canvas .ac-inspector p{font-size:12px;line-height:1.7;margin:12px 0;color:var(--ac-text)}
    #echidna-agent-canvas .ac-inspector code{display:block;background:var(--ac-code);padding:12px;font:11px/1.7 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere;white-space:pre-wrap;border-radius:4px}
    #echidna-agent-canvas .ac-detail-kind{font:10px ui-monospace,monospace;letter-spacing:1px;color:var(--ac-muted)}
    #echidna-agent-canvas .ac-materials{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin-top:6px}
    #echidna-agent-canvas .ac-materials label{display:flex;align-items:center;gap:4px}
    #echidna-agent-canvas .ac-link-route{display:flex;align-items:center;gap:12px;color:var(--ac-green);font-size:13px;padding:12px 0;border-top:1px solid var(--ac-line);border-bottom:1px solid var(--ac-line)}
    #echidna-agent-canvas [hidden]{display:none!important}
    @keyframes ac-appear{from{transform:translateX(-14px);opacity:.3}to{transform:translateX(0);opacity:1}}
    @media(max-width:560px){#echidna-agent-canvas .ac-header{padding:0 16px;gap:10px}#echidna-agent-canvas .ac-caption{display:none}#echidna-agent-canvas .ac-demo{font-size:10px}#echidna-agent-canvas .ac-board-top{left:16px}#echidna-agent-canvas .ac-board-top h2{font-size:21px}#echidna-agent-canvas .ac-tools{left:12px;bottom:66px}#echidna-agent-canvas .ac-zoom{right:12px;bottom:16px}#echidna-agent-canvas .ac-message{bottom:122px;white-space:normal;width:max-content}#echidna-agent-canvas .ac-foot{padding:0 16px}#echidna-agent-canvas .ac-foot .ac-hint{display:none}#echidna-agent-canvas .ac-inspector{right:12px;max-width:calc(100% - 24px);padding:16px}#echidna-agent-canvas input[type="text"],#echidna-agent-canvas select,#echidna-agent-canvas textarea{font-size:16px}}
    @media(prefers-reduced-motion:reduce){#echidna-agent-canvas .ac-trace.new{animation:none}}
    @media(pointer:coarse){#echidna-agent-canvas .ac-button,#echidna-agent-canvas .ac-panel-close,#echidna-agent-canvas .ac-zoom button{min-height:44px}#echidna-agent-canvas .ac-port{width:44px;height:44px;left:calc(50% - 22px);bottom:-23px;padding:17px}}
    #echidna-agent-canvas{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    #echidna-agent-canvas .ac-header{position:absolute;top:20px;left:20px;right:20px;height:44px;padding:0;border:0;gap:12px;z-index:6;pointer-events:none}
    #echidna-agent-canvas .ac-header button{pointer-events:auto}
    #echidna-agent-canvas .ac-logo{font:italic 24px/1 Georgia,"Songti SC",serif;letter-spacing:-.6px;color:var(--ac-muted)}
    #echidna-agent-canvas .cs-canvas-button{display:flex;align-items:center;gap:10px;background:var(--ac-paper);border:1px solid var(--ac-line);border-radius:13px;padding:12px;color:var(--ac-title);font-size:12px;max-width:182px;min-width:0}
    #echidna-agent-canvas .cs-canvas-button svg{width:14px;height:14px}

    #echidna-agent-canvas .ac-board.has-dots{background-image:radial-gradient(var(--ac-line) .8px,transparent .8px);background-size:24px 24px}
    #echidna-agent-canvas .ac-board[data-brush="hand"]{cursor:grab}

    #echidna-agent-canvas .cs-brushes{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:6px;background:var(--ac-paper);border:1px solid var(--ac-line);border-radius:16px;box-shadow:0 3px 14px color-mix(in srgb,var(--ac-title) 5%,transparent);z-index:5;max-width:calc(100% - 32px)}

    #echidna-agent-canvas .cs-brush[aria-pressed="true"]{background:var(--ac-code);color:var(--ac-primary)}

    #echidna-agent-canvas .cs-tool-rule{height:26px;border-left:1px solid var(--ac-line);margin:0 3px}

    #echidna-agent-canvas .ac-tools{bottom:24px;left:20px;padding:5px;border-radius:14px;max-width:calc(100% - 40px);border-color:transparent;background:var(--ac-code)}
    #echidna-agent-canvas .ac-tools .ac-button{border-radius:9px;border:0}
    #echidna-agent-canvas .ac-zoom{bottom:24px;right:20px;border-radius:14px;border-color:transparent;background:var(--ac-code);padding:5px}
    #echidna-agent-canvas .cs-history{display:flex;align-items:center;border-right:1px solid var(--ac-line);padding-right:5px;margin-right:3px}
    #echidna-agent-canvas .cs-history button{border:0;background:none;width:32px;height:32px;color:var(--ac-text);display:grid;place-items:center}
    #echidna-agent-canvas .cs-history button:disabled{opacity:.3}
    #echidna-agent-canvas .cs-history svg{width:15px;height:15px}
    #echidna-agent-canvas .cs-popover{position:absolute;z-index:9;top:74px;left:20px;width:264px;max-width:calc(100% - 24px);border:1px solid var(--ac-line);background:var(--ac-paper);border-radius:16px;padding:10px;box-shadow:0 6px 24px color-mix(in srgb,var(--ac-title) 6%,transparent)}

    #echidna-agent-canvas .cs-popover button[aria-current="true"]{background:var(--ac-code);color:var(--ac-primary)}

    #echidna-agent-canvas .ac-panel-head h3{font-size:20px}
    #echidna-agent-canvas .ac-field{margin:10px 0}
    #echidna-agent-canvas .ac-agent-meta,#echidna-agent-canvas .ac-agent-head,#echidna-agent-canvas .ac-trace-meta{font-family:var(--ac-mono)}
    #echidna-agent-canvas .ac-agent{border-radius:22px 20px 24px 20px;border-color:var(--ac-line)}

    #echidna-agent-canvas .ac-agent-head{border:0;padding:12px 16px 0;height:44px;gap:9px}

    #echidna-agent-canvas .ac-agent-task{font-family:-apple-system,"PingFang SC",sans-serif;font-size:14px;margin:12px 18px 0;height:42px}
    #echidna-agent-canvas .ac-agent-task:before{content:none}
    #echidna-agent-canvas .ac-agent-meta{margin:4px 18px 0;font-size:11px}
    #echidna-agent-canvas .ac-agent-controls{border:0;margin-top:4px;padding:0 13px;gap:4px}

    #echidna-agent-canvas .ac-trace.decision span{color:var(--ac-text)}
